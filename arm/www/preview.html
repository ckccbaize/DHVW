<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARM 场景渲染预览</title>
<style>
  :root { --bg: #0f131b; --panel: #171d29; --line: #2e384d; --ink: #edf1f8; --muted: #9aa7bd; --accent: #4fd1c5; --warn: #f6ad55; --err: #fc8181; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.4 ui-monospace, Consolas, "Microsoft YaHei", monospace; overflow: hidden; }
  .wrap { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { padding: 2px 8px; border: 1px solid var(--line); border-radius: 4px; background: #101520; }
  .pill.ok { border-color: rgba(79, 209, 197, 0.5); color: var(--accent); }
  .pill.bad { border-color: rgba(252, 129, 129, 0.6); color: var(--err); }
  .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button { background: #1f2737; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.active { background: #1b3640; border-color: var(--accent); color: var(--accent); }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px; background: #0a0d13; }
  canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; image-rendering: pixelated; cursor: crosshair; box-shadow: 0 8px 30px rgba(0,0,0,0.6); background: #141820; }
  .errbox { position: absolute; inset: 16px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; background: rgba(34, 15, 20, 0.92); border: 1px solid #9b2c2c; color: #fed7d7; border-radius: 6px; white-space: pre-wrap; }
  .errbox[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="meta">
      <strong id="title">加载中…</strong>
      <span class="pill" id="dims">—</span>
      <span class="pill" id="spots">热点 —</span>
      <span class="pill ok" id="status">初始化…</span>
    </div>
    <div class="controls">
      <button type="button" data-light="day" class="active">白天</button>
      <button type="button" data-light="dusk">黄昏</button>
      <button type="button" data-light="night">夜晚</button>
      <button type="button" data-light="rain">雨天</button>
      <button type="button" id="btnCheckSpots">巡检全部热点</button>
      <button type="button" id="btnReset">回出生点</button>
    </div>
  </div>
  <div class="stage">
    <canvas id="canvas"></canvas>
    <div id="err" class="errbox" hidden></div>
  </div>
</div>
<script type="module">
import { loadScene } from "./js/view/scene-loader.js";
import { createOverview } from "./js/view/overview.js";
import { createStore } from "./js/core/lifestore.js";
import { spawnPoint, bfsPath, isWalkable } from "./js/core/grid.js";
import { createAgent, moveTo, step, placeAt } from "./js/core/pathagent.js";

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const sceneId = params.get("scene") || "home";
const statusEl = $("#status");
const errEl = $("#err");
const canvas = $("#canvas");

function setStatus(text, ok = true) {
  statusEl.textContent = text;
  statusEl.className = `pill ${ok ? "ok" : "bad"}`;
}

function showError(msg) {
  errEl.textContent = msg;
  errEl.hidden = false;
  setStatus("加载失败", false);
}

try {
  const scene = await loadScene(sceneId);
  const [sx, sy] = spawnPoint(scene);
  const agent = createAgent(sx, sy);
  const store = createStore({ light: "day", agent });
  const overview = createOverview({ canvas, scene, store });
  await overview.load();

  $("#title").textContent = `${scene.name || sceneId} (${scene.id || sceneId})`;
  $("#dims").textContent = `${scene.grid.w}×${scene.grid.h} 格 · cell ${scene.grid.cell || 16}`;
  $("#spots").textContent = `热点 ${(scene.hotspots || []).length} 个 · 房间 ${(scene.rooms || []).length} 个`;
  setStatus("渲染就绪 · 点击地图测试寻路");

  let lastTs = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - lastTs) / 1000));
    lastTs = now;
    if (agent.state === "walk") step(agent, dt);
    store.patch({ agent });
    overview.draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const cell = scene.grid.cell || 16;
    const gx = Math.floor(((e.clientX - rect.left) / rect.width) * scene.grid.w);
    const gy = Math.floor(((e.clientY - rect.top) / rect.height) * scene.grid.h);
    if (!isWalkable(scene.grid, gx, gy)) {
      setStatus(`(${gx}, ${gy}) 不可行走（墙/家具）`, false);
      return;
    }
    const path = bfsPath(scene.grid, agent.gx, agent.gy, gx, gy);
    if (!path) {
      setStatus(`(${gx}, ${gy}) 不可达（寻路阻断）`, false);
      return;
    }
    moveTo(agent, path);
    setStatus(`寻路 (${agent.gx},${agent.gy}) → (${gx},${gy})：${path.length} 步`);
  });

  document.querySelectorAll("[data-light]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-light]").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      store.patch({ light: btn.dataset.light });
    });
  });

  $("#btnReset").addEventListener("click", () => {
    placeAt(agent, sx, sy);
    agent.path = [];
    agent.state = "idle";
    agent.act = null;
    setStatus(`已回到出生点 (${sx}, ${sy})`);
  });

  $("#btnCheckSpots").addEventListener("click", () => {
    const spots = scene.hotspots || [];
    if (!spots.length) {
      setStatus("没有定义热点", false);
      return;
    }
    let bad = 0;
    for (const h of spots) {
      if (!isWalkable(scene.grid, h.x, h.y) || !bfsPath(scene.grid, sx, sy, h.x, h.y)) bad += 1;
    }
    if (bad === 0) {
      setStatus(`热点巡检通过：${spots.length}/${spots.length} 全部从出生点可达`);
    } else {
      setStatus(`热点巡检发现 ${bad}/${spots.length} 个不可达`, false);
    }
  });
} catch (err) {
  showError(`场景 ${sceneId} 渲染预览失败：\n${err?.stack || err?.message || err}`);
}
</script>
</body>
</html>
