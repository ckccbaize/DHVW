<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>数字人虚拟仓</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="scene" aria-label="总观场景"></canvas>

    <header id="hud">
      <div class="hud-left">
        <span id="tierBadge" class="tier idle"></span>
        <span class="conn"><i id="connDot" class="dot off"></i><span id="connText">主机未连接</span></span>
      </div>
      <div class="hud-right">
        <span id="clock">第 1 天 08:00</span>
        <span id="fps">0 fps</span>
      </div>
    </header>

    <div id="agentCard" class="agent-card offline">
      <div class="agent-title">工作 Agent</div>
      <div id="agentCardBody">主机未连接</div>
    </div>

    <div id="assetCounts" class="asset-counts">场景 0 / 剧情 0 / 背景 0</div>

    <div id="switch" class="switch" role="switch" aria-label="总观 / 显现" aria-checked="false" tabindex="0">
      <span class="switch-label">总观</span>
      <span class="switch-track"><span id="switchKnob" class="knob"></span></span>
      <span class="switch-label">显现</span>
    </div>

    <div id="menu" hidden>
      <div class="menu-card">
        <button id="btnPauseForge" type="button">暂停端侧生成</button>
        <button id="btnReconnect" type="button">强制重连主机</button>
        <button id="btnCloseMenu" type="button">关闭</button>
      </div>
    </div>

    <div id="dim"></div>
  </div>

  <section id="present" hidden>
    <div class="present-bg"></div>
    <div class="present-portrait">
      <div class="portrait-card">
        <div class="portrait-face"></div>
        <div class="portrait-note">静态立绘占位 · Live2D 资源待交付</div>
      </div>
    </div>
    <div class="present-name">她</div>
    <div class="present-subtitle"></div>
    <div class="present-hint"></div>
  </section>

  <div id="bootError" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
