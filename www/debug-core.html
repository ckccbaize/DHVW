<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>核心机骨架（W1/W3/W4/W5）</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 18px; background: #0f1218; color: #e6e9f0;
         font: 13px/1.6 "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  h2 { font-size: 13px; margin: 14px 0 6px; color: #98a1ae; font-weight: 500; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #2b3242;
           background: #1b2130; color: #e6e9f0; cursor: pointer; }
  button:active { background: #263044; }
  pre { background: #141a24; border: 1px solid #232b3a; border-radius: 8px;
        padding: 10px 12px; overflow: auto; max-height: 32vh; margin: 0; }
  .ok { color: #6fcaa5; } .bad { color: #e07a7a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .machine { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .machine b { color: #e0b070; font-weight: 600; }
</style>
</head>
<body>
<h1>核心机骨架（W1/W3/W4/W5）· <span id="status">启动中…</span></h1>

<div class="machine" id="machine">display=— conn=— tier=— illegal=0 transitions=0</div>
<div class="machine" id="life">minute=— phase=— band=—</div>
<div class="machine" id="logstats">log seq=— count=— dropped=—</div>

<h2>世界事件（点击即派发）</h2>
<div class="row">
  <button data-ev="HOST_UP">HOST_UP</button>
  <button data-ev="HOST_DOWN">HOST_DOWN</button>
  <button data-ev="PRESENT_REQUEST">PRESENT_REQUEST</button>
  <button data-ev="PRESENT_EXIT">PRESENT_EXIT</button>
  <button data-ev="WORLD_START">WORLD_START</button>
  <button data-ev="WORLD_STOP">WORLD_STOP</button>
  <button data-ev="EDGE_START">EDGE_START</button>
  <button data-ev="TAKEOVER">TAKEOVER</button>
</div>

<h2>生活（W4）</h2>
<div class="row">
  <button id="btnLife1h">+1 小时</button>
  <button id="btnLife3h">+3 小时</button>
  <button id="btnMoodUp">心情 +0.2</button>
  <button id="btnPick">选一个热点</button>
</div>

<h2>事件日志（W5）</h2>
<div class="row">
  <button id="btnLogAppend">append 一条</button>
  <button id="btnLogLatest">latest 5</button>
  <button id="btnLogClear">clear</button>
</div>

<h2>基础</h2>
<div class="row">
  <button id="btnSnapshot">snapshot</button>
  <button id="btnPause">pause</button>
  <button id="btnResume">resume</button>
  <button id="btnBadType">未知 type</button>
  <button id="btnBadVersion">错版本</button>
</div>

<div class="grid">
  <div><h2>state</h2><pre id="state">{}</pre></div>
  <div><h2>health</h2><pre id="health">{}</pre></div>
</div>
<h2>消息（最近 20 条）</h2>
<pre id="log"></pre>

<script type="module">
import { createCoreClient } from "./js/core/client.js";
import { makeMsg } from "./js/core/bus.js";

const $ = (s) => document.querySelector(s);
const logEl = $("#log");
const lines = [];
const stateEl = $("#state");
const healthEl = $("#health");
const machineEl = $("#machine");

function pushLine(text) {
  lines.unshift(`${new Date().toLocaleTimeString()}  ${text}`);
  if (lines.length > 20) lines.pop();
  logEl.textContent = lines.join("\n");
}

function renderLog(l) {
  if (!l) return;
  document.querySelector("#logstats").innerHTML =
    `log seq=<b>${l.lastSeq}</b> count=<b>${l.count}</b> dropped=<b>${l.dropped}</b>`;
}

function renderLife(l) {
  if (!l) return;
  const hh = String(Math.floor(l.minute / 60)).padStart(2, "0");
  const mm = String(Math.floor(l.minute % 60)).padStart(2, "0");
  document.querySelector("#life").innerHTML =
    `minute=<b>${hh}:${mm}</b> phase=<b>${l.phase}</b> band=<b>${l.band}</b> ` +
    `energy=<b>${l.mood.energy.toFixed(2)}</b> valence=<b>${l.mood.valence.toFixed(2)}</b> ` +
    `social=<b>${l.mood.social.toFixed(2)}</b> focus=<b>${l.mood.focus.toFixed(2)}</b>`;
}

function renderMachine(m) {
  if (!m) return;
  machineEl.innerHTML =
    `display=<b>${m.display}</b> conn=<b>${m.conn}</b> tier=<b>${m.tier}</b> ` +
    `illegal=<b>${m.illegal}</b> transitions=<b>${m.transitions ?? 0}</b>`;
}

const client = createCoreClient({
  onMessage(msg) {
    if (msg.type === "core:state") {
      const p = msg.payload.patch;
      stateEl.textContent = JSON.stringify(p, null, 1);
      if (p.machine) renderMachine({ ...p.machine, transitions: p.transitions });
      if (p.life) renderLife(p.life);
      if (p.log) renderLog(p.log);
      if (p.display || p.conn || p.tier) {
        renderMachine({ ...(p.machine || {}), display: p.display ?? p.machine?.display, conn: p.conn ?? p.machine?.conn, tier: p.tier ?? p.machine?.tier, transitions: p.transitions });
      }
    }
    if (msg.type === "core:health") {
      healthEl.textContent = JSON.stringify(msg.payload, null, 1);
      renderMachine({ ...msg.payload.world, transitions: msg.payload.transitions });
      renderLife(msg.payload.life);
      renderLog(msg.payload.log);
    }
    if (msg.type === "core:event" && msg.payload.ev?.kind === "world_transition") {
      const r = msg.payload.ev.payload;
      pushLine(`world ${r.event}${r.illegal ? " (illegal)" : ""} → ${r.to.display}/${r.to.conn}/${r.to.tier}`);
      return;
    }
    pushLine(`${msg.type}${msg.replyTo ? " (reply)" : ""}`);
  },
  onError(err) {
    pushLine(`error: ${err.message}`);
  },
});

async function dispatch(type) {
  try {
    const r = await client.request("core:command", { name: "world", args: { event: { type } } });
    if (r.illegal) pushLine(`${type} 被拒绝（illegal）`);
  } catch (e) {
    pushLine(`${type} 失败: ${e.message}`);
  }
}

try {
  client.start();
  const init = await client.request("core:init", { scene: { id: "home" }, clock: { day: 1, minute: 480 } });
  pushLine(`core:init → ${JSON.stringify(init.world)}`);
  await client.request("core:snapshot", {});
  $("#status").textContent = "运行中";
  $("#status").className = "ok";
} catch (err) {
  $("#status").textContent = `失败：${err.message}`;
  $("#status").className = "bad";
}

for (const btn of document.querySelectorAll("[data-ev]")) {
  btn.onclick = () => dispatch(btn.dataset.ev);
}
$("#btnLogAppend").onclick = async () => {
  try {
    const r = await client.request("core:command", { name: "log_append", args: { kind: "debug", payload: { t: Date.now() } } });
    pushLine(`log append → seq=${r.record?.seq ?? "dup"}`);
  } catch (e) { pushLine(e.message); }
};
$("#btnLogLatest").onclick = async () => {
  try {
    const r = await client.request("core:command", { name: "log_latest", args: { n: 5 } });
    pushLine(`log latest → ${r.events.map((e) => e.seq + ":" + e.kind).join(", ")}`);
  } catch (e) { pushLine(e.message); }
};
$("#btnLogClear").onclick = async () => {
  try {
    const r = await client.request("core:command", { name: "log_clear" });
    pushLine(`log clear → seq=${r.stats.lastSeq}`);
  } catch (e) { pushLine(e.message); }
};
$("#btnLife1h").onclick = () => client.request("core:command", { name: "life_advance", args: { minutes: 60 } }).catch((e) => pushLine(e.message));
$("#btnLife3h").onclick = () => client.request("core:command", { name: "life_advance", args: { minutes: 180 } }).catch((e) => pushLine(e.message));
$("#btnMoodUp").onclick = () => client.request("core:command", { name: "life_mood", args: { deltas: { valence: 0.2 } } }).catch((e) => pushLine(e.message));
$("#btnPick").onclick = async () => {
  const hotspots = [
    { x: 2, y: 2, act: "read", room: "living" },
    { x: 6, y: 4, act: "cook", room: "living" },
    { x: 1, y: 1, act: "sleep", room: "bedroom" },
    { x: 8, y: 8, act: "watch", room: "living" },
    { x: 4, y: 6, act: "play", room: "living" },
  ];
  try {
    const r = await client.request("core:command", { name: "life_pick", args: { hotspots, from: { x: 5, y: 5 } } });
    pushLine(`pick → ${r.chosen ? r.chosen.act + "@" + r.chosen.x + "," + r.chosen.y : "null"} (${r.life.phase}/${r.life.band})`);
  } catch (e) {
    pushLine(e.message);
  }
};
$("#btnSnapshot").onclick = () => client.request("core:snapshot", {}).catch((e) => pushLine(e.message));
$("#btnPause").onclick = () => client.request("core:pause", {}).catch((e) => pushLine(e.message));
$("#btnResume").onclick = () => client.request("core:resume", {}).catch((e) => pushLine(e.message));
$("#btnBadType").onclick = () => client.request("core:no_such_type", {}).catch((e) => pushLine(`预期 error: ${e.code}`));

$("#btnBadVersion").onclick = () => {
  const w = new Worker(new URL("./js/core/worker.js", import.meta.url), { type: "module" });
  const msg = { ...makeMsg("core:snapshot", {}), v: 99 };
  w.onmessage = (e) => {
    if (e.data.type !== "error") return;
    pushLine(`bad_version → ${e.data.payload?.code}`);
    w.terminate();
  };
  w.postMessage(msg);
};

window.__core = { client, lines };
</script>
</body>
</html>
