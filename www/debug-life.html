<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活调试台</title>
<style>
  :root { --ink:#1a1a2e; --bg:#f4efe6; --card:#fffaf0; --muted:#6b6b7b; --line:#1a1a2e; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:13px/1.5 ui-monospace,Consolas,monospace; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  section { background:var(--card); border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); padding:10px; min-height:120px; }
  section.wide { grid-column:1 / -1; }
  h2 { font-size:14px; margin:0 0 8px; display:flex; justify-content:space-between; }
  .count { color:var(--muted); font-weight:400; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; vertical-align:top; padding:4px 6px; border-bottom:1px solid #ddd4c4; }
  th { color:var(--muted); font-weight:400; }
  .ok { color:#1f7a3d; } .bad { color:#b3261e; }
  .pre { white-space:pre-wrap; word-break:break-word; max-height:none; overflow:visible; }
  .plan-block { border:2px solid #1a1a2e; background:#fff; padding:8px; margin-bottom:10px; }
  .plan-head { display:flex; gap:8px; align-items:center; margin-bottom:4px; }
  .timeline { width:100%; margin-top:6px; border-collapse:collapse; }
  .timeline th, .timeline td { border:1px solid #1a1a2e; padding:2px 4px; text-align:left; vertical-align:top; }
  .llm-item { border:1px solid #1a1a2e; margin-bottom:6px; background:#fff; }
  .llm-item summary { cursor:pointer; padding:4px 6px; display:flex; gap:8px; align-items:center; }
  .llm-item .llm-body { padding:6px; border-top:1px solid #1a1a2e; }
  .llm-item .llm-label { font-weight:bold; margin:4px 0 2px; }
  .muted { color:var(--muted); }
  .pill { display:inline-block; border:1px solid var(--line); padding:0 6px; margin-right:4px; background:#fff; }
  .empty { color:var(--muted); padding:8px 0; }
  form.llm { display:grid; grid-template-columns:120px 1fr; gap:8px 10px; align-items:center; margin:8px 0; }
  form.llm input { width:100%; padding:6px 8px; border:2px solid var(--line); background:#fff; font:inherit; }
  form.llm .actions { grid-column:1 / -1; display:flex; gap:8px; align-items:center; }
  button { border:2px solid var(--line); background:#fff; box-shadow:2px 2px 0 var(--line); padding:5px 10px; font:inherit; cursor:pointer; }
  button:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--line); }
  .hint { color:var(--muted); }
  @media (max-width:800px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<h1>生活调试台</h1>
<div class="sub" id="status">读取中…</div>
<section style="margin-bottom:12px">
  <h2>LLM 配置 <span class="count" id="llmSource"></span></h2>
  <form class="llm" id="llmForm" autocomplete="off">
    <label for="baseUrl">baseUrl</label>
    <input id="baseUrl" name="baseUrl" placeholder="https://api.example.com/v1" spellcheck="false">
    <label for="apiKey">apiKey</label>
    <input id="apiKey" name="apiKey" type="password" placeholder="sk-..." spellcheck="false">
    <label for="model">model</label>
    <input id="model" name="model" placeholder="deepseek-chat" spellcheck="false">
    <div class="actions">
      <button type="submit">保存并重载</button>
      <button type="button" id="btnTest">测试连接</button>
      <button type="button" id="btnLoadKey">读取本机 apikey</button>
      <button type="button" id="btnClear">清除覆盖</button>
      <span class="hint" id="llmMsg">保存到本机 localStorage，主页面会自动重载</span>
    </div>
  </form>
</section>
<section style="margin-bottom:12px">
  <h2>主动触发 <span class="count">主页面需保持打开</span></h2>
  <div class="actions" style="display:flex;flex-wrap:wrap;gap:8px">
    <button type="button" data-trigger="thought">立即独白</button>
    <button type="button" data-trigger="memory">立即归纳记忆</button>
    <button type="button" data-trigger="write">立即写作</button>
    <button type="button" data-trigger="plot">立即剧情</button>
    <button type="button" data-trigger="night">设为黑夜</button>
    <button type="button" data-trigger="browse">浏览网页</button>
    <button type="button" data-trigger="sleep">强制睡觉</button>
    <button type="button" data-trigger="wake">强制醒来</button>
    <button type="button" data-trigger="act" data-act="read">去阅读</button>
    <button type="button" data-trigger="act" data-act="cook">去做饭</button>
    <button type="button" data-trigger="act" data-act="write">去写作</button>
    <button type="button" data-trigger="act" data-act="bath">去洗澡</button>
  </div>
  <div class="hint" id="triggerMsg" style="margin-top:8px">点击后由主页面执行；结果看下方事件流与 LLM 调用</div>
</section>
<section style="margin-bottom:12px">
  <h2>时间倍速 <span class="count" id="speedNow">1×</span></h2>
  <div class="actions" style="display:flex;flex-wrap:wrap;gap:8px">
    <button type="button" data-speed="0.5">0.5×</button>
    <button type="button" data-speed="1">1×</button>
    <button type="button" data-speed="2">2×</button>
    <button type="button" data-speed="5">5×</button>
    <button type="button" data-speed="10">10×</button>
    <button type="button" data-speed="30">30×</button>
  </div>
  <div class="hint" style="margin-top:8px">1× ≈ 现实时间（1 现实秒 2 游戏秒）；30× = 1 现实秒 1 游戏分钟；行为间隔固定 30 游戏分钟</div>
</section>
<section style="margin-bottom:12px">
  <h2>今日剧情 / 心情 <span class="count" id="todayCount"></span></h2>
  <div id="todayPlot">还没有夜间剧情</div>
  <div id="moodView" class="hint" style="margin-top:6px"></div>
  <div id="desiresView" class="pre" style="margin-top:6px"></div>
  <div id="suddenView" class="pre" style="margin-top:6px"></div>
  <div id="highlightView" class="pre" style="margin-top:6px"></div>
  <div id="summaryView" class="pre" style="margin-top:6px"></div>
</section>
<div class="grid">
  <section class="wide">
    <h2>LLM 调用 <span class="count" id="llmCount"></span></h2>
    <div id="llm"></div>
  </section>
  <section>
    <h2>本地记忆 <span class="count" id="memCount"></span></h2>
    <div id="mem"></div>
  </section>
  <section>
    <h2>创作产出 <span class="count" id="writeCount"></span></h2>
    <div id="writings"></div>
  </section>
  <section>
    <h2>剧情产出 <span class="count" id="plotCount"></span></h2>
    <div id="plots"></div>
  </section>
  <section>
    <h2>地图申请 <span class="count" id="sceneReqCount"></span></h2>
    <div id="sceneRequests"></div>
  </section>
  <section>
    <h2>浏览记录 <span class="count" id="browseCount"></span></h2>
    <div id="browses"></div>
  </section>
  <section class="wide">
    <h2>最近事件 <span class="count" id="evCount"></span></h2>
    <div id="events"></div>
  </section>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (t) => (t ? new Date(t).toLocaleTimeString("zh-CN", { hour12: false }) : "");

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("dhvw", 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("events")) {
        const st = db.createObjectStore("events", { keyPath: "uuid" });
        st.createIndex("t", "t_corrected");
      }
      if (!db.objectStoreNames.contains("assets")) db.createObjectStore("assets", { keyPath: "id" });
      if (!db.objectStoreNames.contains("blobs")) db.createObjectStore("blobs", { keyPath: "id" });
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", { keyPath: "k" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function getAll(db, store) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, "readonly").objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function getCoreKV(k) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("dhvw-core", 4);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", { keyPath: "k" });
    };
    req.onsuccess = () => {
      const db = req.result;
      const get = db.transaction("kv", "readonly").objectStore("kv").get(k);
      get.onsuccess = () => { db.close(); resolve(get.result ? get.result.v : undefined); };
      get.onerror = () => { db.close(); reject(get.error); };
    };
    req.onerror = () => reject(req.error);
  });
}

function getKV(db, k) {
  return new Promise((resolve, reject) => {
    const req = db.transaction("kv", "readonly").objectStore("kv").get(k);
    req.onsuccess = () => resolve(req.result ? req.result.v : undefined);
    req.onerror = () => reject(req.error);
  });
}

function renderLlm(rows) {
  $("#llmCount").textContent = `${rows.length} 条`;
  if (!rows.length) return ($("#llm").innerHTML = '<div class="empty">还没有 LLM 调用</div>');
  const openKeys = new Set(
    [...$("#llm").querySelectorAll("details[open]")].map((d) => d.dataset.key),
  );
  $("#llm").innerHTML = rows
    .slice()
    .reverse()
    .map((r) => {
      const key = `${r.t}-${r.agent || r.kind || "?"}-${(r.response || "").length}`;
      return `<details class="llm-item" data-key="${esc(key)}"${openKeys.has(key) ? " open" : ""}><summary><span class="muted">${fmt(r.t)}</span><span class="pill">${esc(r.agent || r.kind || "?")}</span><span class="${r.ok ? "ok" : "bad"}">${r.ok ? "ok" : "fail"}</span><span class="muted">${r.ms ?? r.latencyMs ?? ""}ms</span></summary><div class="llm-body"><div class="llm-label">输入</div><div class="pre">${esc(r.prompt || "")}</div><div class="llm-label">输出</div><div class="pre">${esc(r.response || "")}</div></div></details>`;
    })
    .join("");
}
function renderMem(rows) {
  $("#memCount").textContent = `${rows.length} 条`;
  $("#mem").innerHTML = rows.length
    ? `<table><tr><th>层级</th><th>事实</th></tr>${rows.map((r) => `<tr><td>${esc(r.tier || "")}</td><td>${esc(r.text)}</td></tr>`).join("")}</table>`
    : '<div class="empty">还没有记忆事实；需要至少 3 条事件并调用 memory-summarize</div>';
}
function renderWritings(rows) {
  $("#writeCount").textContent = `${rows.length} 篇`;
  $("#writings").innerHTML = rows.length
    ? rows.slice().reverse().map((w) => `<div style="margin-bottom:8px"><span class="pill">${esc(w.kind)}</span><span class="muted">第${w.day}天 ${Math.floor(w.minute / 60)}:${String(Math.floor(w.minute % 60)).padStart(2, "0")} · ${esc(w.room)}</span><div class="pre">${esc(w.text)}</div></div>`).join("")
    : '<div class="empty">还没有创作产出</div>';
}
function hhmm(m) {
  return `${String(Math.floor((m || 0) / 60)).padStart(2, "0")}:${String((m || 0) % 60).padStart(2, "0")}`;
}
function planBlock(day, p) {
  const rows = (p.behaviors || []).slice().sort((a, b) => a.minute - b.minute);
  return `<div class="plan-block">
    <div class="plan-head"><span class="pill">第 ${day} 天</span><span class="muted">${p.event || "剧情"} · ${esc(p.place || "")}</span></div>
    <div class="pre">${esc(p.text || "")}</div>
    <div class="muted" style="margin-top:4px">作息 ${hhmm(p.sleepAt || 1320)} 睡 / ${hhmm(p.wakeAt || 480)} 起 · 日程 ${rows.length} 条${p.sudden ? ` · 突发 ${hhmm(p.sudden.minute)} ${esc(p.sudden.text)}` : ""}</div>
    ${rows.length ? `<table class="timeline"><tr><th>时间</th><th>行为</th><th>地点</th><th>原因</th></tr>${rows.map((b) => `<tr><td>${hhmm(b.minute)}</td><td>${esc(b.act)}</td><td>${esc(b.place)}</td><td>${esc(b.why || "")}</td></tr>`).join("")}</table>` : ""}
  </div>`;
}
function renderPlots(rows) {
  const byDay = new Map();
  for (const p of rows) {
    const day = p.forDay || p.day;
    if (!byDay.has(day) || (p.created_at || 0) > (byDay.get(day).created_at || 0)) byDay.set(day, p);
  }
  const days = [...byDay.keys()].sort((a, b) => b - a);
  $("#plotCount").textContent = `${days.length} 天`;
  $("#plots").innerHTML = days.length
    ? days.map((d) => planBlock(d, byDay.get(d))).join("")
    : '<div class="empty">还没有剧情产出</div>';
}
function renderSceneRequests(rows) {
  $("#sceneReqCount").textContent = `${rows.length} 条`;
  $("#sceneRequests").innerHTML = rows.length
    ? rows.slice().reverse().map((r) => {
        const spec = r.mapSpec || {};
        const when = r.createdAt ? new Date(r.createdAt).toLocaleTimeString() : "";
        return `<div class="row"><b>${esc(spec.name || r.id)}</b> <span class="pill">${esc(r.status || "?")}</span> ${esc(r.mode || "")} ${esc(spec.kind || "")} · ${esc(when)}<div class="pre">${esc(JSON.stringify(spec))}</div></div>`;
      }).join("")
    : '<div class="empty">还没有提交地图申请</div>';
}

function renderBrowses(rows) {
  $("#browseCount").textContent = `${rows.length} 条`;
  $("#browses").innerHTML = rows.length
    ? rows.slice().reverse().map((b) => {
        const page = b.result?.page;
        const list = b.result?.results?.slice(0, 3) || [];
        return `<div class="row"><b>${esc(b.plan?.query || b.plan?.url || "浏览")}</b><div class="pre">${esc(page?.title || "")}${page?.text ? `\n${esc(page.text.slice(0, 300))}` : ""}${list.length ? `\n${esc(list.map((r) => r.title + " " + r.url).join("\n"))}` : ""}</div></div>`;
      }).join("")
    : '<div class="empty">还没有浏览记录</div>';
}

function renderEvents(rows) {
  $("#evCount").textContent = `${rows.length} 条`;
  $("#events").innerHTML = rows.length
    ? `<table><tr><th>时间</th><th>事件</th><th>内容</th></tr>${rows.slice().reverse().map((e) => `<tr><td>${fmt(e.t_local)}</td><td><span class="pill">${esc(e.kind)}</span></td><td class="pre">${esc(JSON.stringify(e.payload || {}))}</td></tr>`).join("")}</table>`
    : '<div class="empty">还没有事件</div>';
}

const LLM_KEY = "dhvw_llm";
const llmForm = $("#llmForm");
const llmMsg = $("#llmMsg");
let baseConfig = null;

function readOverride() {
  try {
    return JSON.parse(localStorage.getItem(LLM_KEY) || "null");
  } catch {
    return null;
  }
}

async function loadLlmForm(forceAuto = false) {
  try {
    baseConfig = await fetch("config.json", { cache: "no-store" }).then((r) => r.json());
  } catch {
    baseConfig = {};
  }
  const saved = readOverride();
  let auto = null;
  if (!saved || forceAuto) {
    try {
      const res = await fetch("/__llm/config", { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        if (data?.ok) auto = data;
      }
    } catch {
      auto = null;
    }
  }
  const cfg = { ...(baseConfig.llm || {}), ...(auto || {}), ...(saved || {}) };
  $("#baseUrl").value = cfg.baseUrl || "";
  $("#apiKey").value = cfg.apiKey || "";
  $("#model").value = cfg.model || "";
  $("#llmSource").textContent = saved
    ? "本机覆盖"
    : auto
      ? `本机 apikey：${auto.source || ""}`
      : "config.json";
}

llmForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const cfg = {
    baseUrl: $("#baseUrl").value.trim(),
    apiKey: $("#apiKey").value.trim(),
    model: $("#model").value.trim(),
  };
  localStorage.setItem(LLM_KEY, JSON.stringify(cfg));
  llmMsg.textContent = "已保存，正在重载主页面…";
  try {
    new BroadcastChannel("dhvw-debug").postMessage("llm-updated");
  } catch {}
  $("#llmSource").textContent = "本机覆盖";
});

$("#btnClear").addEventListener("click", () => {
  localStorage.removeItem(LLM_KEY);
  llmMsg.textContent = "已清除本机覆盖，重载后使用 config.json";
  try {
    new BroadcastChannel("dhvw-debug").postMessage("llm-updated");
  } catch {}
  void loadLlmForm();
});

$("#btnLoadKey").addEventListener("click", () => {
  void loadLlmForm(true);
});

$("#btnTest").addEventListener("click", async () => {
  const cfg = {
    baseUrl: $("#baseUrl").value.trim(),
    apiKey: $("#apiKey").value.trim(),
    model: $("#model").value.trim(),
  };
  if (!cfg.baseUrl || !cfg.model) {
    llmMsg.textContent = "baseUrl 和 model 必填";
    return;
  }
  llmMsg.textContent = "测试中…";
  try {
    const res = await fetch("/__llm/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        baseUrl: cfg.baseUrl,
        apiKey: cfg.apiKey,
        body: { model: cfg.model, messages: [{ role: "user", content: "只回复 ok" }], max_tokens: 8, stream: false },
      }),
    });
    const text = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 120)}`);
    const data = JSON.parse(text);
    const content = data?.choices?.[0]?.message?.content;
    llmMsg.textContent = content ? `连接成功：${content.slice(0, 40)}` : "连接成功，但返回缺少 content";
  } catch (err) {
    llmMsg.textContent = `失败：${err.message}`;
  }
});

async function refresh() {
  try {
    const cfg = await fetch("config.json", { cache: "no-store" }).then((r) => r.json()).catch(() => ({}));
    let auto = null;
    try {
      const res = await fetch("/__llm/config", { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        if (data?.ok) auto = data;
      }
    } catch {}
    const llmCfg = { ...(cfg.llm || {}), ...(auto || {}), ...(readOverride() || {}) };
    $("#status").innerHTML = `LLM：<span class="${llmCfg.baseUrl && llmCfg.model ? "ok" : "bad"}">${llmCfg.baseUrl && llmCfg.model ? `${esc(llmCfg.model)} @ ${esc(llmCfg.baseUrl)}` : "未配置"}</span> · 每 2 秒刷新`;
    const db = await openDb();
    const [llmLog, mem, writings, plots, sceneReqs, daily, mood, browses, desires, sudden, highlight, summary, events] = await Promise.all([
      getKV(db, "llm_log"),
      getKV(db, "memory_docs"),
      getKV(db, "writings"),
      getKV(db, "plots"),
      getCoreKV("scene_requests"),
      getKV(db, "daily_plots"),
      getKV(db, "mood"),
      getKV(db, "browse_log"),
      getKV(db, "desires"),
      getKV(db, "sudden_events"),
      getKV(db, "memory_highlight"),
      getKV(db, "memory_summary"),
      getAll(db, "events"),
    ]);
    renderLlm(llmLog || []);
    renderMem(mem || []);
    renderWritings(writings || []);
    renderPlots(plots || []);
    renderSceneRequests(sceneReqs || []);
    renderBrowses(browses || []);
    const today = Object.values(daily || {}).sort((a, b) => b.forDay - a.forDay)[0];
    $("#todayCount").textContent = today ? `第 ${today.forDay} 天` : "";
    $("#todayPlot").innerHTML = today ? planBlock(today.forDay, today) : "还没有夜间剧情";
    $("#moodView").textContent = mood
      ? `energy ${mood.energy?.toFixed(2)} · valence ${mood.valence?.toFixed(2)} · social ${mood.social?.toFixed(2)} · focus ${mood.focus?.toFixed(2)}`
      : "心情：0";
    const lastDesire = (desires || []).slice(-1)[0];
    $("#desiresView").textContent = lastDesire
      ? `愿望：${(lastDesire.desires || []).join(" / ")}`
      : "愿望：暂无";
    $("#suddenView").textContent = (sudden || []).length
      ? `突发事件：${sudden.slice(-3).map((s) => `第${s.day}天 ${s.text}`).join(" / ")}`
      : "突发事件：暂无";
    $("#highlightView").textContent = highlight ? `最高印象：${highlight.text}（${highlight.reason || ""}）` : "最高印象：暂无";
    $("#summaryView").textContent = summary ? `记忆摘要：${summary}` : "记忆摘要：暂无";
    renderEvents((events || []).sort((a, b) => a.t_corrected - b.t_corrected).slice(-80));
  } catch (err) {
    $("#status").innerHTML = `<span class="bad">读取失败：${esc(err.message)}</span>`;
  }
}
const SPEED_KEY = "dhvw_speed";
function showSpeed(v) {
  $("#speedNow").textContent = `${v}×`;
}
showSpeed(Number(localStorage.getItem(SPEED_KEY) || "1"));
document.querySelectorAll("[data-speed]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const v = Number(btn.dataset.speed);
    localStorage.setItem(SPEED_KEY, String(v));
    showSpeed(v);
    try {
      new BroadcastChannel("dhvw-debug").postMessage({ type: "speed", value: v });
    } catch {}
  });
});

document.querySelectorAll("[data-trigger]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const kind = btn.dataset.trigger;
    const act = btn.dataset.act || null;
    try {
      new BroadcastChannel("dhvw-debug").postMessage({ type: "trigger", kind, act });
      $("#triggerMsg").textContent = `已发送：${kind}${act ? ` / ${act}` : ""}（${new Date().toLocaleTimeString("zh-CN", { hour12: false })}）`;
    } catch (err) {
      $("#triggerMsg").textContent = `发送失败：${err.message}`;
    }
  });
});

void loadLlmForm();
refresh();
setInterval(refresh, 2000);
</script>
</body>
